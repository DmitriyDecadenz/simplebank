[project]
name = "simplebank"
version = "0.1.0"
description = "Simple Bank"
authors = [
    { name = "Dimitri Khubulashvili", email = "dima.hubul@icloud.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dishka>=1.10.1",
    "django>=5.2,<6.0",
    "django-ninja>=1.3.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.5.0",
    "structlog>=26.1.0",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [
    { include = "src" }
]


